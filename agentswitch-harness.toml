# AgentSwitch harness runner (Release 8.1): "Our harness" -> Submit for a run.
# It checks out the commit on the saved branch, runs `install` (internet allowed), then `run` once per instance
# below against a fresh copy of that instance (writes are thrown away, no internet), and reads `results`.
# One run per team every 3 days: check with `python scripts/check_results.py` before submitting.
install = "pip install -r requirements.txt"
run = "python -m harness.runner"
results = "results.json"
instances = ["suryodaya", "keystone"]
timeout_minutes = 30
